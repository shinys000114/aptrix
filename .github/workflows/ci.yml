# SPDX-License-Identifier: GPL-3.0-only
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  APTLY_VERSION: "1.6.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Unit tests
        run: go test -race ./...

      # aptly from distro packages is too old (publish sources API needs 1.6),
      # so build the pinned release from source.
      - name: Cache aptly
        id: aptly-cache
        uses: actions/cache@v6
        with:
          path: .cache/aptly
          key: aptly-${{ env.APTLY_VERSION }}-${{ runner.os }}

      - name: Build aptly ${{ env.APTLY_VERSION }}
        if: steps.aptly-cache.outputs.cache-hit != 'true'
        run: make aptly APTLY_VERSION=${{ env.APTLY_VERSION }}

      - name: Integration tests
        run: make integration APTLY_VERSION=${{ env.APTLY_VERSION }}

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
